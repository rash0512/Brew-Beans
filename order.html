</head>
<body>

<header class="header">
<div class="container navbar">
<a href="index.html" class="logo">Brew & Beans</a>
<input type="checkbox" id="menu" class="menu-toggle">
<label for="menu" class="menu-icon">☰</label>
<ul class="nav-links">

<li><a href="about.html">About</a></li>

</header>

<section class="section">
<div class="container">
<h1 class="section-title">Order Your Coffee</h1>
<p class="section-desc">Fill in your details to place a demo order.</p>

<form class="form-box" action="#" method="post">

<label for="name">Full Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number" required>

<label for="coffee">Choose Coffee</label>
<select id="coffee" required>
<option value="">Select Coffee</option>
<option>Espresso</option>
<option>Cappuccino</option>
<option>Latte</option>
<option>Cold Coffee</option>
<option>Mocha</option>
</select>

<label for="quantity">Quantity</label>
<input type="number" id="quantity" min="1" value="1" required>

<label for="address">Delivery Address</label>
<textarea id="address" rows="4" placeholder="Enter delivery address" required></textarea>

<button type="submit" class="btn">Place Order</button>

</form>
</div>
</section>

<footer class="footer">
<div class="container">
<h3>Brew & Beans</h3>
<p>Thank you for choosing us.</p>
</div>
</footer>

</body>
